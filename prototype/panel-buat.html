<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buat turnamen · Turnamen Catur KSL</title>
<link rel="stylesheet" href="assets/style.css?v=1794697018">
</head>
<body data-page="panel-buat" data-area="panel">
<div id="stage"><div id="app"><main id="view"></main></div></div>
<script src="assets/app.js?v=1794697018"></script>
<script>
const {icon}=KSL;
const st={step:0,fmt:"rr",classes:["Kelas A","Kelas B"],tb:null};
const {TERMS,TB}=KSL;
const tbList=()=>st.tb||(st.tb=TB[st.fmt].slice(0,4));
const SYS={rr:["Liga satu putaran","Semua pemain saling bertemu sekali. Cocok untuk 10 pemain atau kurang."],swiss:["Swiss","Pemain dengan poin sama dipertemukan. Cocok untuk peserta banyak."],ko:["Gugur","Kalah langsung tersingkir. Cepat selesai."]};
KSL.page(()=>{
  const S=["Info","Kelas dan sistem","Terbitkan"];
  let f="";
  if(st.step===0)f=`
    <div class="field"><label>Nama turnamen</label><input value="Turnamen Bulanan KSL Desember"></div>
    <div class="grid g2e"><div class="field"><label>Tanggal</label><input type="date" value="2026-12-20"></div><div class="field"><label>Jam</label><input value="07.00 - 09.00 WIB"></div></div>
    <div class="field"><label>Tempat</label><input value="Jl. Basar 99 Bugih, Pamekasan"></div>
    <div class="field"><label>Waktu per pemain${KSL.tip("Menit per pemain + tambahan detik setiap langkah. Isi 0 bila tidak ada tambahan.")}</label><div class="row nowrap"><select style="flex:1"><option>Rapid</option><option>Blitz</option><option>Klasik</option></select><input value="15" style="width:64px"><span class="sm mute">menit +</span><input value="0" style="width:56px"><span class="sm mute">detik</span></div></div>
    <div class="grid g2e"><div class="field"><label>Wasit</label><input value="Mukhlish"></div><div class="field"><label>Biaya pendaftaran</label><input value="Rp 5.000"></div></div>`;
  if(st.step===1)f=`
    <div class="field"><label>Kelas${KSL.tip("Pisahkan pemain per kemampuan, misalnya Kelas A untuk pemain kuat dan Kelas B untuk pemula.")}</label><div class="chips">${st.classes.map((k,i)=>`<span class="chip on">${k}<button data-act="rm" data-i="${i}" aria-label="Hapus ${k}">${icon("x")}</button></span>`).join("")}<button class="chip" data-act="addk">${icon("plus")}Tambah kelas</button></div></div>
    <div class="field"><label>Sistem pertandingan</label><div class="grid g3">${Object.entries(SYS).map(([k,[n,d]])=>`<button class="opt ${st.fmt===k?"on":""}" data-act="fmt" data-k="${k}"><b>${n}${KSL.tip(d)}</b></button>`).join("")}</div></div>
    <div class="grid g2e"><div class="field"><label>Jumlah babak${KSL.tip(st.fmt==="rr"?"Otomatis: jumlah pemain dikurangi 1.":st.fmt==="ko"?"Otomatis dari jumlah pemain.":"Disarankan 5 sampai 7.")}</label><input value="${st.fmt==="swiss"?5:st.fmt==="ko"?"otomatis":7}" ${st.fmt==="swiss"?"":"disabled"}></div>
    </div>
    <div class="field"><label>Tie-break${KSL.tip("Penentu peringkat bila poin sama, dipakai berurutan dari 1. Sudah diisi otomatis sesuai sistem.")}</label>
      ${st.fmt==="ko"?'<div class="sm mute">Tidak dipakai di sistem gugur.</div>':`
      <div class="tbl">${tbList().map((t,i)=>`<div class="tbrow"><span class="tbn">${i+1}</span><div style="flex:1;min-width:0" class="row nowrap"><select data-tb="${i}">${TB[st.fmt].map(o=>`<option ${o===t?"selected":""}>${o}</option>`).join("")}</select>${KSL.tip(t+": "+TERMS[t])}</div></div>`).join("")}</div>`}
    </div>
    <details class="more"><summary>Pengaturan lanjutan</summary>
      <div class="grid g2e mt">
        <div><label>Poin bye${KSL.tip(KSL.TERMS["Bye"])}</label><select><option>1</option><option>½</option><option>0</option></select></div>
        <div><label>Batas peserta</label><input placeholder="Tanpa batas"></div>
      </div>
      <button class="row nowrap mt" style="width:100%;justify-content:space-between" data-act="pro" data-f="Kategori juara"><span class="sm">${icon("trophy")} Kategori juara (U-12, putri, senior)</span>${KSL.pro()?'<span class="pill ok">Aktif</span>':KSL.proPill}</button>
    </details>`;
  if(st.step===2)f=`
    <table class="mb"><tr><td class="mute">Nama</td><td><b>Turnamen Bulanan KSL Desember</b></td></tr><tr><td class="mute">Tanggal</td><td>20 Des 2026, 07.00 - 09.00 WIB</td></tr><tr><td class="mute">Kelas</td><td>${st.classes.join(", ")}</td></tr><tr><td class="mute">Sistem</td><td>${SYS[st.fmt][0]}</td></tr></table>
    <div class="row nowrap" style="align-items:flex-start"><div class="qr"></div><div class="sm"><b>Link turnamen</b><div class="mute mt2">turnamencatur-ksl.id/t/bulanan-des</div><div class="row mt"><button class="btn alt sm" data-act="copy">${icon("copy")}Salin</button><button class="btn alt sm" data-act="wa">${icon("msg")}Kirim ke WA</button></div></div></div>`;
  return KSL.panelShell("panel-buat",`
  <h1 class="mb">Buat turnamen</h1>
  <div class="card pad">
    <div class="prog"><div class="row between"><b>${S[st.step]}</b></div>
      <div class="track"><i style="width:${(st.step+1)/S.length*100}%"></i></div>
      <div class="labels">${S.map((x,i)=>`<span class="${i===st.step?"on":i<st.step?"done":""}">${i<st.step?icon("check"):""}${x}</span>`).join("")}</div></div>
    ${f}
    <div class="row between mt bt" style="padding-top:12px"><button class="btn alt" data-act="prev" ${st.step?"":"disabled"}>${icon("left")}Kembali</button><button class="btn ${st.step===2?"acc":""}" data-act="next">${st.step===2?icon("check")+"Terbitkan":"Lanjut"+icon("right")}</button></div>
  </div>`)},{
  prev:()=>st.step=Math.max(0,st.step-1),
  next:()=>{if(st.step===2){KSL.toast("Turnamen diterbitkan");setTimeout(()=>location.href="panel.html",900)}else st.step++},
  fmt:el=>{st.fmt=el.dataset.k;st.tb=null},
  addk:()=>st.classes.push("Kelas "+String.fromCharCode(65+st.classes.length)),
  rm:el=>st.classes.splice(+el.dataset.i,1),
  copy:()=>KSL.copyLink(),wa:()=>window.open(KSL.waHref(),"_blank","noopener")
});
document.addEventListener("change",e=>{const i=e.target.dataset.tb;if(i==null)return;st.tb[+i]=e.target.value;KSL.render()});
</script>
</body>
</html>
