<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turnamen akan datang · Turnamen Catur KSL</title>
<link rel="stylesheet" href="assets/style.css?v=1794697351">
</head>
<body data-page="segera" data-area="publik">
<div id="stage"><div id="app"><main id="view"></main></div></div>
<script src="assets/app.js?v=1794697351"></script>
<script>
const {TOURS,icon,pill,qp,av}=KSL;
const T=TOURS.find(t=>t.id===qp("t","galis")&&t.status==="soon")||TOURS.find(t=>t.status==="soon");
KSL.page(()=>{
  // registered = sample list + sign-ups made in this browser
  const mine=KSL.pending().filter(p=>p.t===T.id).map(p=>[p.name,p.club,1]);
  const reg=T.reg.concat(mine),clubs=new Set(reg.map(r=>r[1])).size;
  return `<a class="back" href="index.html">${icon("left")}Semua turnamen</a>
  <div class="card pad mb">
    <div class="row between nowrap"><h1>${T.name}</h1>${pill(T.status)}</div>
    <div class="meta mt2"><span>${icon("cal")}${T.date}, ${T.time}</span><span>${icon("pin")}${T.place}</span><span>${icon("list")}${T.sys}</span><span>${icon("org")}${T.org}</span></div>
    <div class="grid g4 mt">
      <div class="card stat"><b>${reg.length}<span class="sm mute"> / ${T.n}</span></b><span>pendaftar</span></div>
      <div class="card stat"><b>${clubs}</b><span>klub</span></div>
      <div class="card stat"><b>${T.fee}</b><span>biaya</span></div>
      <div class="card stat"><b style="font-size:15px">${T.until}</b><span>batas daftar</span></div>
    </div>
    <div class="row mt"><a class="btn" href="daftar-peserta.html?t=${T.id}">${icon("user")}Daftar jadi peserta</a><span class="pill acc">${T.open}</span>${KSL.tip("Pemain dari klub mana pun bisa mendaftar. Penyelenggara menerima atau menolak, lalu peserta dikabari lewat WhatsApp.","Pendaftaran lintas klub")}</div>
  </div>
  <h3>Sudah mendaftar</h3>
  <div class="card list">${reg.map(([n,c,me])=>`<div>${av(n)}<div class="grow"><b>${n}</b><div class="sm mute">${c}</div></div>${me?'<span class="pill">Menunggu</span>':'<span class="pill ok">Diterima</span>'}</div>`).join("")}</div>`;
});
</script>
</body>
</html>
