<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ringkasan · Turnamen Catur KSL</title>
<link rel="stylesheet" href="assets/style.css?v=1794697018">
</head>
<body data-page="turnamen" data-area="publik">
<div id="stage"><div id="app"><main id="view"></main></div></div>
<script src="assets/app.js?v=1794697018"></script>
<script>
const {T,icon,standings,curRound,doneRounds,fmt,link,pLink}=KSL;
KSL.page(()=>{
  const info=[["cal","Tanggal",T.date],["clock","Waktu",T.time],["pin","Tempat",T.place],["list","Sistem",T.sys],["trophy","Tie-break",T.tb],["user","Wasit","Mukhlish"]];
  return KSL.tourHead("turnamen")+`
  <div class="grid g2">
    <div>
      <h3>Kelas</h3>
      <div class="grid g2e mb">${T.classes.map((c,i)=>{const s=standings(c),d=doneRounds(c),n=c.rounds.length;return `
        <div class="card">
          <div class="pad row between"><div><b>${c.name}</b><div class="sm mute">${c.desc} · ${c.players.length} pemain</div></div><span class="pill live">Babak ${curRound(c)}</span></div>
          <div class="pad bt"><div class="row between sm mute mb"><span>Babak selesai</span><span>${d} / ${n}</span></div><div class="bar"><i style="width:${d/n*100}%"></i></div></div>
          <table class="bt">${s.slice(0,3).map((p,j)=>`<tr><td class="n"><span class="rank r${j+1}">${j+1}</span></td><td>${pLink(p.id,p.name)}</td><td class="r b">${fmt(p.pts)}</td></tr>`).join("")}</table>
          <div class="pad bt row"><a class="btn sm" href="${link("pairing.html",{kelas:i})}">${icon("swap")}Pairing</a><a class="btn alt sm" href="${link("klasemen.html",{kelas:i})}">${icon("trophy")}Klasemen</a></div>
        </div>`}).join("")}</div>
      <h3>Informasi</h3>
      <div class="card"><table>${info.map(([i,k,v])=>`<tr><td class="mute" style="width:1%">${icon(i)}</td><td class="mute">${k}</td><td><b>${v}</b></td></tr>`).join("")}</table></div>
    </div>
    <div>
      <h3>Bagikan</h3>
      <div class="card pad mb">
        <div class="row nowrap" style="align-items:flex-start"><div class="qr"></div><div class="sm"><b>Tempel QR di lokasi</b><div class="mute mt2">Peserta scan untuk melihat pairing dan klasemen.</div></div></div>
        <div class="row mt"><button class="btn alt sm" data-act="copy">${icon("copy")}Salin link</button><a class="btn alt sm" href="${KSL.waHref()}" target="_blank" rel="noopener">${icon("msg")}Kirim ke WA</a></div>
      </div>
      <h3>Pendaftaran peserta</h3>
      <div class="card pad">
        <div class="sm">Biaya ${T.fee}. Panitia akan mengonfirmasi lewat WhatsApp.</div>
        <a class="btn sm mt" href="${link("daftar-peserta.html")}">${icon("user")}Daftar jadi peserta</a>
      </div>
    </div>
  </div>
  <div class="sm mute mt">Terakhir diperbarui 08.12 WIB oleh Mukhlish</div>`;
},{copy:()=>KSL.copyLink()});
</script>
</body>
</html>
