<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paket · Turnamen Catur KSL</title>
<link rel="stylesheet" href="assets/style.css?v=1794696723">
</head>
<body data-page="paket" data-area="panel">
<div id="stage"><div id="app"><main id="view"></main></div></div>
<script src="assets/app.js?v=1794696723"></script>
<script>
const {icon,qp}=KSL;
// prices are proposals for client discussion, payment is simulated
const FREE=["Turnamen & peserta tanpa batas","Liga, Swiss, gugur","Pairing, klasemen, tie-break otomatis","Halaman publik + QR","Rating Elo klub","Pendaftaran peserta + impor CSV"];
const PRO=["Kategori juara (U-12, putri, senior)","Kirim pairing ke WA peserta","Sertifikat juara (PDF)","Ekspor PDF, Excel, TRF","Logo & warna klub sendiri","Beberapa admin / wasit"];
let pay=null; // selected plan while paying
KSL.page(()=>{
  const f=qp("f"),cur=KSL.plan(),li=(x,ok=1)=>`<li>${icon(ok?"check":"x")}${x}</li>`;
  const card=(id,name,price,per,items,cta,hl)=>`<div class="card pad plan ${hl?"hl":""}">
    <div class="row between"><b>${name}</b>${cur===id?'<span class="pill ok">Aktif</span>':""}</div>
    <div class="price">${price}<span> ${per}</span></div>
    <ul>${items}</ul>${cta}</div>`;
  return KSL.panelShell("paket",`
  <h1 class="mb">Paket${KSL.tip("Fitur inti selalu gratis. Premium membuka fitur tambahan. Turnamen pertama: Premium terbuka gratis. Harga masih usulan.")}</h1>
  ${f?`<div class="card pad mb row nowrap" style="background:var(--accent-soft)">${icon("lock")}<span class="sm"><b>${f}</b> termasuk Premium.</span></div>`:""}
  ${pay?`<div class="card pad mb" style="max-width:420px">
      <b>Bayar ${pay==="event"?"Premium Turnamen · Rp 49.000":"Premium Klub · Rp 299.000/tahun"}</b>
      <div class="chips mt">${["QRIS","Transfer VA","GoPay","OVO","DANA"].map((m,i)=>`<span class="chip ${i?"":"on"}">${m}</span>`).join("")}</div>
      <div class="row mt"><button class="btn acc" data-act="paid">${icon("check")}Bayar (simulasi)</button><button class="btn alt" data-act="cancel">Batal</button></div>
    </div>`:""}
  <div class="plans">
    ${card("free","Gratis","Rp 0","selamanya",FREE.map(x=>li(x)).join("")+PRO.slice(0,2).map(x=>li(x,0)).join(""),cur==="free"?'<span class="btn alt" style="opacity:.6">Paket saat ini</span>':'<button class="btn alt" data-act="down">Kembali ke Gratis</button>')}
    ${card("event","Premium Turnamen","Rp 49rb","/ turnamen",li("Semua fitur Gratis")+PRO.map(x=>li(x)).join(""),cur==="event"?'<span class="btn alt" style="opacity:.6">Aktif</span>':'<button class="btn" data-act="buy" data-p="event">Pilih</button>')}
    ${card("club","Premium Klub","Rp 299rb","/ tahun",li("Semua fitur Premium")+li("Turnamen tanpa batas")+li("Hemat untuk turnamen rutin"),cur==="club"?'<span class="btn alt" style="opacity:.6">Aktif</span>':'<button class="btn acc" data-act="buy" data-p="club">Pilih</button>',1)}
  </div>
  <div class="card pad mt row nowrap">${icon("info")}<span class="sm">Pembayaran pendaftaran peserta online: biaya layanan per transaksi, bukan langganan.${KSL.tip("Uang pendaftaran langsung ke rekening penyelenggara lewat payment gateway berizin BI. Platform hanya memotong biaya layanan.")}</span></div>`)
},{
  buy:el=>{pay=el.dataset.p},
  cancel:()=>{pay=null},
  paid:()=>{KSL.setPlan(pay);pay=null;KSL.toast("Premium aktif (simulasi)");setTimeout(()=>location.reload(),900)},
  down:()=>{KSL.setPlan("free");KSL.toast("Kembali ke paket Gratis");setTimeout(()=>location.reload(),900)}
});
</script>
</body>
</html>
