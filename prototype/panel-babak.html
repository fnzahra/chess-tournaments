<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Babak dan hasil · Turnamen Catur KSL</title>
<link rel="stylesheet" href="assets/style.css?v=1794697018">
</head>
<body data-page="panel-babak" data-area="panel">
<div id="stage"><div id="app"><main id="view"></main></div></div>
<script src="assets/app.js?v=1794697018"></script>
<script>
const {T,icon,kelas,qp,link,curRound}=KSL;
let r=null,swap=false,pick=null; // pick = [board, "w"|"b"]
const nameBtn=(c,x,i,sd)=>swap?`<button class="nm chip ${pick&&pick[0]===i&&pick[1]===sd?"on":""}" data-act="pick" data-b="${i}" data-s="${sd}">${c.players[x[sd]].name}</button>`:`<span class="nm">${c.players[x[sd]].name}</span>`;
KSL.page(()=>{
  const c=T.classes[kelas()],cr=curRound(c);
  if(r==null)r=Math.min(+qp("babak",cr)||cr,c.pub);
  const g=c.rounds[r-1],left=g.filter(x=>!x.res).length,last=r===c.rounds.length;
  return KSL.panelShell("panel-babak",`
  <div class="row between mb"><div><h1>Babak dan hasil</h1><div class="sm mute">${T.name}</div></div><a class="btn alt sm" href="${link("pairing.html",{babak:r})}">Lihat halaman publik${icon("right")}</a></div>
  <div class="card">
    <div class="pad row between">
      <div class="row"><div class="seg">${T.classes.map((k,i)=>`<a class="${i===kelas()?"on":""}" href="${link("panel-babak.html",{kelas:i,babak:null})}">${k.name}</a>`).join("")}</div>
      <div class="seg">${c.rounds.map((_,i)=>`<a class="${i+1===r?"on":""} ${i+1>c.pub?"off":""}" href="#" data-act="round" data-r="${i+1}">${i+1}</a>`).join("")}</div></div>
      <span class="pill ${left?"live":"ok"}">${left?left+" meja belum ada hasil":"Babak "+r+" lengkap"}</span>
    </div>
    ${g.map((x,i)=>`<div class="board bt" style="grid-template-columns:28px 1fr auto">
      <span class="no">${i+1}</span>
      <span class="row nowrap" style="min-width:0;gap:6px"><i class="sq w"></i>${nameBtn(c,x,i,"w")}<span class="mute sm">vs</span>${nameBtn(c,x,i,"b")}<i class="sq k"></i></span>
      ${swap?`<button class="btn alt sm" data-act="color" data-b="${i}" ${x.res?"disabled":""}>${icon("swap")}Warna</button>`:`<span class="seg">${["1-0","½-½","0-1"].map(v=>`<button class="${x.res===v?"on":""}" data-act="res" data-b="${i}" data-v="${v}">${v}</button>`).join("")}</span>`}
    </div>`).join("")}
    <div class="pad bt row between">
      <span class="sm mute">${swap?"Ketuk dua nama":""}${KSL.tip(swap?"Ketuk dua nama untuk menukar lawan, atau tombol Warna untuk menukar putih/hitam. Meja yang sudah ada hasilnya tidak bisa diubah.":"Ketuk hasil untuk menyimpan, ketuk lagi untuk membatalkan. Klasemen publik ikut berubah otomatis.")}</span>
      <div class="row"><button class="btn alt sm" data-act="pro" data-f="Kirim pairing ke WA">${icon("msg")}Kirim ke WA${KSL.pro()?"":" "+KSL.proPill}</button><button class="btn ${swap?"":"alt"} sm" data-act="swap">${icon(swap?"check":"edit")}${swap?"Selesai mengubah":"Ubah pairing"}</button>
      <button class="btn sm ${left?"alt":"acc"}" data-act="next" ${left||last||r<c.pub?"disabled":""}>${icon("swap")}${last?"Babak terakhir":"Buat pairing babak "+(r+1)}</button></div>
    </div>
  </div>`)},{
  round:el=>r=+el.dataset.r,
  res:el=>{const x=T.classes[kelas()].rounds[r-1][+el.dataset.b],v=el.dataset.v;x.res=x.res===v?null:v;KSL.save();KSL.toast(x.res?"Hasil meja "+(+el.dataset.b+1)+" disimpan":"Hasil dibatalkan")},
  swap:()=>{swap=!swap;pick=null},
  color:el=>{const x=T.classes[kelas()].rounds[r-1][+el.dataset.b];[x.w,x.b]=[x.b,x.w];KSL.save();KSL.toast("Warna meja "+(+el.dataset.b+1)+" ditukar")},
  pick:el=>{const g=T.classes[kelas()].rounds[r-1],b=+el.dataset.b,sd=el.dataset.s;
    if(g[b].res){KSL.toast("Meja "+(b+1)+" sudah ada hasilnya","info");return}
    if(!pick){pick=[b,sd];return}
    const[a,as]=pick;pick=null;if(a===b&&as===sd)return;
    const t=g[a][as];g[a][as]=g[b][sd];g[b][sd]=t;KSL.save();KSL.toast("Posisi pemain ditukar")},
  next:()=>{const c=T.classes[kelas()];c.pub=r+1;r++;KSL.save();KSL.toast("Pairing babak "+r+" diterbitkan")}
});
</script>
</body>
</html>
