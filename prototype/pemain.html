<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detail pemain · Turnamen Catur KSL</title>
<link rel="stylesheet" href="assets/style.css?v=1794697018">
</head>
<body data-page="pemain" data-area="publik">
<div id="stage"><div id="app"><main id="view"></main></div></div>
<script src="assets/app.js?v=1794697018"></script>
<script>
const {T,icon,standings,fmt,link,kelas,qp,score,pLink}=KSL;
KSL.page(()=>{
  const c=T.classes[kelas()],id=Math.min(+qp("id",0)||0,c.players.length-1),p=c.players[id];
  const s=standings(c),rank=s.findIndex(x=>x.id===id)+1,me=s[rank-1];
  let cum=0,dElo=0;
  const rows=c.rounds.slice(0,c.pub).map((g,ri)=>{
    const bi=g.findIndex(x=>x.w===id||x.b===id);if(bi<0)return `<tr><td class="n">${ri+1}</td><td colspan="5" class="mute">Bye</td></tr>`;
    const x=g[bi],white=x.w===id,op=c.players[white?x.b:x.w],sc=score(x.res),v=sc?sc[white?0:1]:null;
    if(v!=null){cum+=v;dElo+=40*(v-1/(1+Math.pow(10,(op.rtg-p.rtg)/400)))}
    return `<tr><td class="n">${ri+1}</td><td class="n">${bi+1}</td><td class="n"><i class="sq ${white?"w":"k"}" title="${white?"Putih":"Hitam"}"></i></td><td>${pLink(op.id,op.name)} <span class="mute sm">${op.rtg}</span></td><td class="n ${v===1?"res-w":v===0?"res-l":"res-d"}">${v==null?'<span class="mute">main</span>':fmt(v)}</td><td class="n b">${v==null?"":fmt(cum)}</td></tr>`}).join("");
  // sample cross-club history (prototype data): same player profile used by any organiser
  const hist=[["Turnamen Catur Hari Pahlawan 2026","KSL","10 Nov 2026",12+id,"80"],["Open Galis Cup 2026","Komunitas Catur Galis","Sep 2026",3+id%4,"32"],["Rintisan Pelajar 2025","KSL","Des 2025",5+id%3,"16"]];
  const pts=[1200,1260+id*20,1320+id*15,p.rtg-20,p.rtg],mx=Math.max(...pts),mn=Math.min(...pts);
  const spark=pts.map((v,i)=>`${i*40},${36-((v-mn)/(mx-mn||1))*32}`).join(" ");
  const pid="TC-"+String(1000+id+kelas()*100).padStart(5,"0");
  return `<a class="back" href="${link("klasemen.html",{id:null})}">${icon("left")}Klasemen ${c.name}</a>
  <div class="card pad mb">
    <div class="row between nowrap">
      <div class="row nowrap">${KSL.av(p.name,"lg")}
      <div><h1>${p.name}</h1><div class="meta"><span>${icon("org")}${p.club}</span><span>${pid}${KSL.tip("ID pemain berlaku di semua klub dan penyelenggara. Pemain bisa ikut turnamen klub mana pun dengan profil yang sama.")}</span><span>${c.name}</span></div></div></div>
      <span class="rank ${rank<4?"r"+rank:""}" style="width:34px;height:34px;font-size:14px" title="Peringkat">${rank}</span>
    </div>
    <div class="grid g4 mt">
      <div class="card stat"><b>${fmt(me.pts)}</b><span>poin</span></div>
      <div class="card stat"><b>${rank}</b><span>peringkat</span></div>
      <div class="card stat"><b>${me.w} / ${me.d} / ${me.l}</b><span>menang / seri / kalah</span></div>
      <div class="card stat"><b>${p.rtg} <span class="${dElo>=0?"res-w":"res-l"}" style="font-size:13px">${dElo>=0?"+":"−"}${Math.abs(Math.round(dElo))}</span></b><span>rating${KSL.tip("Satu rating per pemain, dihitung dari semua turnamen yang memakai rating, dari klub mana pun. Angka +/− adalah perkiraan dari turnamen ini.")}</span></div>
    </div>
  </div>
  <div class="grid g2 mb">
    <div><h3>Riwayat turnamen</h3>
      <div class="card list">${hist.map(([n,o,d,rk,np])=>`<div><div class="grow"><b class="sm">${n}</b><div class="sm mute">${o} · ${d}</div></div><span class="sm mute">#${rk} / ${np}</span></div>`).join("")}</div></div>
    <div><h3>Rating</h3>
      <div class="card pad"><svg viewBox="-4 0 168 40" width="100%" height="56" aria-label="Grafik rating"><polyline points="${spark}" fill="none" stroke="var(--brand)" stroke-width="2"/>${pts.map((v,i)=>`<circle cx="${i*40}" cy="${36-((v-mn)/(mx-mn||1))*32}" r="2.5" fill="var(--brand)"/>`).join("")}</svg>
      <div class="row between sm mute"><span>${pts[0]}</span><span>${p.rtg}</span></div></div></div>
  </div>
  <h3>Babak di turnamen ini</h3>
  <div class="card tscroll"><table>
    <tr><th class="n">Babak</th><th class="n">Meja</th><th class="n">Warna</th><th>Lawan</th><th class="n">Hasil</th><th class="n">Total</th></tr>${rows}
  </table></div>`;
});
</script>
</body>
</html>
