<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar klub · Turnamen Catur</title>
<link rel="stylesheet" href="assets/style.css?v=1794710626">
</head>
<body data-page="daftar" data-area="publik">
<div id="stage"><div id="app"><main id="view"></main></div></div>
<script src="assets/app.js?v=1794710626"></script>
<script>
const {icon,CLUBS}=KSL;
let done=null;
// one short form: club + contact (email or phone) + password
KSL.page(()=>done?`
  <div class="card pad" style="max-width:440px;margin:24px auto;text-align:center">
    <span class="av lg" style="background:var(--ok-soft);color:var(--ok)">${icon("check","lg")}</span>
    <h1 class="mt">${done} terdaftar</h1>
    <div class="sm mute mt2">Kamu sudah bisa membuat turnamen. Turnamen pertama tampil di beranda setelah ditinjau admin.</div>
    <a class="btn mt" href="panel-buat.html">${icon("plus")}Buat turnamen</a>
  </div>`:`
  <div class="card" style="max-width:460px;margin:16px auto">
    <div class="pad"><h1>Daftar klub / komunitas</h1></div>
    <form class="pad bt" id="f">
      <div class="field"><label>Nama klub / komunitas</label><input name="club" required placeholder="Komunitas Catur Galis"></div>
      <div class="field"><label>Kota</label><input name="city" required placeholder="Pamekasan"></div>
      <div class="field"><label>Email atau nomor HP</label><input name="id" required placeholder="nama@email.com / 08xx"></div>
      <div class="field"><label>Kata sandi</label><input name="pw" type="password" required minlength="8" placeholder="Minimal 8 karakter"></div>
      <button class="btn block" type="submit">Daftar</button>
      <div class="sm mute mt" style="text-align:center">Dengan mendaftar kamu menyetujui Syarat & Ketentuan dan Kebijakan Privasi.</div>
    </form>
    <div class="pad bt sm mute" style="text-align:center">Sudah punya akun? <a class="lnk" href="masuk.html">Masuk</a></div>
  </div>`);
document.addEventListener("submit",e=>{e.preventDefault();const f=new FormData(e.target),name=f.get("club").trim();
  if(CLUBS.some(c=>c.name.toLowerCase()===name.toLowerCase())){KSL.toast("Nama klub sudah terdaftar. Masuk dengan akun klub itu, atau pakai nama lain.","x",3200);return}
  done=name;KSL.render();KSL.toast("Akun klub dibuat")});
</script>
</body>
</html>
