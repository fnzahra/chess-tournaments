<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar jadi peserta · Turnamen Catur KSL</title>
<link rel="stylesheet" href="assets/style.css?v=1794697351">
</head>
<body data-page="daftar-peserta" data-area="publik">
<div id="stage"><div id="app"><main id="view"></main></div></div>
<script src="assets/app.js?v=1794697351"></script>
<script>
const {TOURS,icon,kelas,link,qp}=KSL;
const T=TOURS.find(t=>t.id===qp("t","ksl"))||TOURS[0];
const CL=T.classes||[{name:"Umum",desc:"Terbuka untuk semua klub"}];
const back=T.classes?link("turnamen.html"):"segera.html?t="+T.id;
let done=null;
KSL.page(()=>done?`
  <div class="card pad" style="max-width:440px;margin:24px auto;text-align:center">
    <span class="av lg" style="background:var(--ok-soft);color:var(--ok)">${icon("check","lg")}</span>
    <h1 class="mt">Pendaftaran terkirim</h1>
    <div class="sm mute mt2">${done.name} mendaftar di ${CL[done.k].name}. Panitia akan mengonfirmasi lewat WhatsApp.</div>
    <a class="btn alt mt" href="${back}">Kembali ke turnamen</a>
  </div>`:`
  <a class="back" href="${back}">${icon("left")}${T.name}</a>
  <div class="card" style="max-width:520px">
    <div class="pad"><h1>Daftar jadi peserta</h1><div class="meta mt2"><span>${icon("cal")}${T.date}</span><span>${icon("pin")}${T.place}</span><span>Biaya ${T.fee}</span></div></div>
    <form class="pad bt" id="f">
      <div class="field"><label>Kelas</label><div class="grid g2e">${CL.map((c,i)=>`<label class="opt ${i===kelas()?"on":""}" style="margin:0"><input type="radio" name="k" value="${i}" ${i===kelas()?"checked":""} style="display:none"><b>${c.name}</b><span class="sm mute">${c.desc}</span></label>`).join("")}</div></div>
      <div class="field"><label>Nama lengkap</label><input name="name" required placeholder="Sesuai yang ingin ditampilkan"></div>
      <div class="grid g2e"><div class="field"><label>Klub asal${KSL.tip("Boleh dari klub mana pun, atau isi kota bila tidak punya klub.","Klub asal")}</label><input name="club" placeholder="Pamekasan"></div><div class="field"><label>Nomor WhatsApp${KSL.tip("Untuk konfirmasi panitia. Tidak tampil di publik.","Nomor WhatsApp")}</label><input name="hp" inputmode="tel" required placeholder="08xx"></div></div>
      <div class="field"><label>Tanggal lahir (opsional)${KSL.tip("Untuk kategori usia. Tidak tampil di publik.","Tanggal lahir")}</label><input name="dob" type="date"></div>
      <label class="row nowrap sm" style="color:var(--ink);font-weight:500;align-items:flex-start"><input type="checkbox" required style="width:auto;height:auto;margin-top:2px"> Saya (atau orang tua/wali untuk peserta di bawah 17 tahun) setuju data ini dipakai untuk turnamen ini.</label>
      <button class="btn block mt" type="submit">Kirim pendaftaran</button>
    </form>
  </div>`);
document.addEventListener("change",e=>{if(e.target.name==="k")document.querySelectorAll(".opt").forEach(o=>o.classList.toggle("on",o.contains(e.target)))});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=new FormData(e.target),name=f.get("name").trim();if(!name)return;
  const p={t:T.id,k:+f.get("k")||0,name,club:f.get("club").trim()||"-",at:Date.now()};
  KSL.setPending(KSL.pending().concat(p));done=p;KSL.render();
});
</script>
</body>
</html>
