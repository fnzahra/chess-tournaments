<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peserta · Turnamen Catur KSL</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="peserta" data-area="publik">
<div id="stage"><div id="app"><main id="view"></main></div></div>
<script src="assets/app.js"></script>
<script>
const {T,kelas,hit,pLink}=KSL;
KSL.page(()=>{
  const c=T.classes[kelas()],ps=c.players.slice().sort((a,b)=>b.rtg-a.rtg);
  const clubs=[...new Set(c.players.map(p=>p.club))].length;
  return KSL.tourHead("peserta")+`
  <div class="grid g3 keep3 mb">
    <div class="card stat"><b>${c.players.length}</b><span>pemain</span></div>
    <div class="card stat"><b>${Math.round(c.players.reduce((a,p)=>a+p.rtg,0)/c.players.length)}</b><span>rata-rata rating</span></div>
    <div class="card stat"><b>${clubs}</b><span>asal kota / klub</span></div>
  </div>
  <div class="card tscroll"><table>
    <tr><th class="n">No</th><th>Nama</th><th class="n">Rating</th><th>Klub / Kota</th></tr>
    ${ps.map((p,i)=>`<tr class="${hit(p)?"hl":""}"><td class="n">${i+1}</td><td>${pLink(p.id,p.name,1)}</td><td class="n">${p.rtg||"-"}</td><td class="mute">${p.club}</td></tr>`).join("")}
  </table></div>
  <div class="sm mute mt">Diurutkan berdasarkan rating awal. Rating adalah rating klub, bukan rating FIDE.</div>`;
});
</script>
</body>
</html>
